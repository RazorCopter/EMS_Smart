[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afore-companion-collector"
version = "1.0.16"
description = "Read-only MQTT & ESP32 REST telemetry/decision collector for Afore EMS Companion"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.2.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29.0",
    "prometheus-client>=0.20.0",
    "aiohttp>=3.9.5,<4.0",
    "afore-energy-domain",
    "afore-companion-db",
]

[tool.setuptools.packages.find]
where = ["src"]
