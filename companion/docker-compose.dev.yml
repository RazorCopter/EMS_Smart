services:
  mosquitto-dev:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "11883:1883"
    volumes:
      - ./deploy/docker/mosquitto-dev.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - companion-internal

  postgres-timescaledb:
    ports:
      - "15432:5432"

  companion-api:
    ports:
      - "18000:8000"
