[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afore-energy-domain"
version = "1.0.15"
description = "Pure energy domain models, telemetry normalization, KPIs, and SEM/ESP SHADOW comparison for Afore EMS Companion"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
