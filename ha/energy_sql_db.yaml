##############################################################
#
# PVPerformance — Sensori SQL mensili
#
# Inverter: Solarman
#
# metadata_id:
#   483 = sensor.solarman_etotal_inverter       (produzione)
#   486 = sensor.solarman_etotal_to_load        (consumo casa)
#   485 = sensor.solarman_etotal_received_from_grid (import)
#   484 = sensor.solarman_etotal_feed_into_grid (export)
#
# Installazione:
#   1. Copia questo blocco in /config/packages/ oppure
#      includi in configuration.yaml con:
#        sensor: !include_dir_merge_list packages/
#   2. Riavvia Home Assistant
#
##############################################################

sql:
  # =========================
  # GENNAIO 2026
  # =========================

  - name: FV 2026 01 Produzione DB
    unique_id: fv_2026_01_produzione_db
    db_url: sqlite:////config/home-assistant_v2.db
    query: >
      SELECT ROUND(COALESCE((SELECT sum FROM statistics WHERE metadata_id = 483 AND start_ts <= strftime('%s','2026-02-01 00:00:00','localtime') ORDER BY start_ts DESC LIMIT 1) - (SELECT sum FROM statistics WHERE metadata_id = 483 AND start_ts <= strftime('%s','2026-01-01 00:00:00','localtime') ORDER BY start_ts DESC LIMIT 1), 0), 2) AS value;
    column: value
    unit_of_measurement: "kWh"

