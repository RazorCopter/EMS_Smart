# Afore AF5K-SL — Single-phase 5kW hybrid inverter with battery
#
# SOURCES:
#
#   A. Afore official documentation:
#      - Doc/外部Ems调度 - En_240312.docx (External EMS Modbus Protocol Specification)
#      - Doc/艾伏逆变器寄存器参数表（対外）v3.4_20251119_並網機和儲能機分類(2).xlsx
#   B. Doc/Afore_Autonomous_EMS_V4_Roadmap.md Section 4 — Telemetry registers validated against
#      operational Solarman integration deployment
#   C. Solarman Home Assistant integration: afore_AF5K-Sl.yaml (production baseline)
#
# VERIFICATION STATUS per register documented inline. VERIFIED = confirmed in official docs (A)
# AND/OR validated in operational Solarman integration (B+C). UNVERIFIED = estimated, must be
# validated through Phase 0 passive observation before field deployment.
#
# CRITICAL PHASE 0 CONSTRAINTS:
#   - READ-ONLY PROFILE: Zero [[write]] blocks. External EMS control dormant until Phase 6.
#   - EEPROM Protection: 0x0BC1 (CurrMaxChg) strictly forbidden from any write path.
#   - Sign conventions: Battery power (0x07D8) and grid power (0x0212) require Phase 0 validation
#     through full charge/discharge and import/export observation cycles.
#
# Function code 3 (holding registers) throughout. Device address factory default 1 (to confirm).
# Expected serial: 9600 8N1 (validate via passive capture before querying).

[profile]
driver = "modbus_profile"
id = "afore_af5k_sl"
display_name = "Afore AF5K-SL (5kW single-phase hybrid)"
manufacturer = "Afore"
status = "experimental"           # Phase 0: unproven on hardware, all UNVERIFIED regs subject to correction
default = false
phases = 1
mppts = 2
battery = true
transports = ["rtu"]

[serial]
baud = 9600
parity = "none"
stop_bits = 1

# ------------------------------------------------------------------------------------------
# Read blocks: Conservative Phase 0 strategy with tight blocks around documented registers.
# Poll interval 5–10s during scouting, zero retries. Blocks sized to enable TRACE-level raw
# dump inspection while respecting 125-register Modbus limit.
# ------------------------------------------------------------------------------------------

[[block]]
space = "holding"
start = 512                       # 0x0200–0x0212 (19 regs): Inverter status, temperature, output power, grid
count = 19

[[block]]
space = "holding"
start = 552                       # 0x0228–0x0230 (9 regs): PV1/PV2 voltage, current, power
count = 9

[[block]]
space = "holding"
start = 2000                      # 0x07D0–0x07D8 (9 regs): Battery state, SOC, voltage, current, power
count = 9

# ------------------------------------------------------------------------------------------
# PV Telemetry — String Power
# ------------------------------------------------------------------------------------------

[[register]]                      # VERIFIED (B, C): Roadmap §4, Solarman YAML
measurement = "dc.power.total"
display_name = "Total PV Power"
space = "holding"
address = 554                     # 0x022A
type = "u16"
scale = 1
unit = "W"

[[register]]                      # VERIFIED (B): Roadmap §4 explicit
measurement = "dc.mppt_1.power"
display_name = "PV1 Power"
space = "holding"
address = 557                     # 0x022D
type = "u16"
scale = 1
unit = "W"

[[register]]                      # VERIFIED (B): Roadmap §4 explicit
measurement = "dc.mppt_2.power"
display_name = "PV2 Power"
space = "holding"
address = 560                     # 0x0230
type = "u16"
scale = 1
unit = "W"

# ------------------------------------------------------------------------------------------
# PV Telemetry — String Voltage and Current
# Phase 0 note: These are UNVERIFIED. Vendor table lists offsets but cross-check needed.
# ------------------------------------------------------------------------------------------

[[register]]                      # UNVERIFIED: Vendor table offset; confirm via inverter display
measurement = "dc.mppt_1.voltage"
display_name = "PV1 Voltage"
space = "holding"
address = 552                     # 0x0228
type = "u16"
scale = 0.1
unit = "V"

[[register]]                      # UNVERIFIED: Adjacent to voltage; scale 0.1A assumed
measurement = "dc.mppt_1.current"
display_name = "PV1 Current"
space = "holding"
address = 553                     # 0x0229
type = "u16"
scale = 0.1
unit = "A"

[[register]]                      # UNVERIFIED: Vendor table offset; confirm via inverter display
measurement = "dc.mppt_2.voltage"
display_name = "PV2 Voltage"
space = "holding"
address = 558                     # 0x022E
type = "u16"
scale = 0.1
unit = "V"

[[register]]                      # UNVERIFIED: Adjacent to voltage; scale 0.1A assumed
measurement = "dc.mppt_2.current"
display_name = "PV2 Current"
space = "holding"
address = 559                     # 0x022F
type = "u16"
scale = 0.1
unit = "A"

# ------------------------------------------------------------------------------------------
# Battery Telemetry
# CRITICAL: Battery power (0x07D8) scale = -1 because Afore reports OPPOSITE sign convention
# to canonical battery.power (Roadmap §4: "Negativo osservato in carica"). MUST VALIDATE in
# Phase 0 through full charge/discharge cycle observation.
# ------------------------------------------------------------------------------------------

[[register]]                      # VERIFIED (A, B, C): Official docs + Solarman + Roadmap
measurement = "battery.soc"
display_name = "Battery State of Charge"
space = "holding"
address = 2002                    # 0x07D2
type = "u16"
scale = 1
unit = "%"

[[register]]                      # VERIFIED (B, C): Roadmap + Solarman
measurement = "battery.voltage"
display_name = "Battery Voltage"
space = "holding"
address = 2004                    # 0x07D4
type = "u16"
scale = 0.1
unit = "V"

[[register]]                      # VERIFIED (B, C): Roadmap + Solarman; SIGN TO CONFIRM in Phase 0
measurement = "battery.current"
display_name = "Battery Current"
space = "holding"
address = 2005                    # 0x07D5
type = "s16"
scale = 0.01
unit = "A"

# Battery power: Afore reports NEGATIVE during charge (opposite of canonical convention).
# scale = -1 flips sign to match battery.power semantics (positive = charging).
# Phase 0 MUST validate this across full charge/discharge cycle.
[[register]]                      # VERIFIED (B, C): Roadmap §4 "Negativo osservato in carica"; scale = -1 corrects
measurement = "battery.power"
display_name = "Battery Power"
space = "holding"
address = 2008                    # 0x07D8
type = "s16"
scale = -1                        # SIGN FLIP: Afore convention opposite of canonical
unit = "W"

# Battery state enum: 4 = Charge, 5 = Discharge, 6 = Standby per Roadmap §4.
# Note: This is a status observation register, not a writable mode setpoint.
# [[register]]                    # VERIFIED (B): Roadmap §4 enum values documented
# measurement = "battery.state"   # TODO: Check if canonical measurement exists for enum state
# display_name = "Battery Running State"
# space = "holding"
# address = 2000                  # 0x07D0
# type = "u16"
# unit = ""
# # Enum values: 4=Charge, 5=Discharge, 6=Standby
# # Note: Not mapped yet; awaiting enum measurement support in canonical vocabulary

# ------------------------------------------------------------------------------------------
# Grid and Inverter Output
# CRITICAL: Grid power (0x0212) sign convention MUST BE VALIDATED in Phase 0.
# Canonical: positive = import, negative = export. Confirm via known import/export states.
# ------------------------------------------------------------------------------------------

[[register]]                      # VERIFIED (B, C): Roadmap + Solarman; SIGN TO CONFIRM in Phase 0
measurement = "grid.power"
display_name = "Grid Power"
space = "holding"
address = 530                     # 0x0212
type = "s16"
scale = 1                         # Sign convention: positive = import, negative = export (TO VERIFY)
unit = "W"

[[register]]                      # VERIFIED (B, C): Roadmap + Solarman
measurement = "ac.power.total"
display_name = "Inverter Output Power"
space = "holding"
address = 523                     # 0x020B
type = "s16"
scale = 1
unit = "W"

# ------------------------------------------------------------------------------------------
# Grid — Voltage and Frequency
# Phase 0 note: UNVERIFIED. Expected values 230V ±10%, 50Hz ±0.5Hz for European grid.
# ------------------------------------------------------------------------------------------

[[register]]                      # UNVERIFIED: Typical grid voltage register; confirm via multimeter
measurement = "ac.phase_l1.voltage"
display_name = "Grid Voltage"
space = "holding"
address = 515                     # 0x0203
type = "u16"
scale = 0.1
unit = "V"

[[register]]                      # UNVERIFIED: Standard frequency register; confirm 50.00 Hz nominal
measurement = "ac.frequency"
display_name = "Grid Frequency"
space = "holding"
address = 517                     # 0x0205
type = "u16"
scale = 0.01
unit = "Hz"

# ------------------------------------------------------------------------------------------
# Inverter Status and Temperature
# Phase 0 note: Status register (0x0200) is inverter running status, NOT EMS mode (0x09C4).
# Roadmap §4 warns about confusion between these two registers.
# ------------------------------------------------------------------------------------------

# Inverter running status enum: UNVERIFIED, Solarman mapping varies by firmware revision.
# [[register]]                    # UNVERIFIED: Running status; enum values firmware-dependent
# measurement = "inverter.status" # TODO: Check canonical measurement for status enum
# display_name = "Inverter Running Status"
# space = "holding"
# address = 512                   # 0x0200
# type = "u16"
# unit = ""
# # Enum values: TBD during Phase 0 observation

[[register]]                      # UNVERIFIED: Sensor location and scale to confirm
measurement = "inverter.temperature"
display_name = "Inverter Temperature"
space = "holding"
address = 524                     # 0x020C
type = "s16"
scale = 0.1
unit = "°C"

# ------------------------------------------------------------------------------------------
# NOT MAPPED: External EMS Control Registers (Phase 6 Only)
# ------------------------------------------------------------------------------------------
# The following registers are DOCUMENTED in official Afore External EMS specification but are
# STRICTLY EXCLUDED from this Phase 0 read-only profile:
#
#   0x09C4 (2500)       EMS Mode — Configuration register (5 = External EMS)
#   0x0A08 (2568)       External Control Type — 0=battery power, 1=inverter power
#   0x0A09–0x0A0A       Active Power Setpoint — Signed 32-bit watts, requires FC10
#   0x0BC1 (3009)       Max Charge Current (CurrMaxChg) — EEPROM HAZARD, STRICTLY FORBIDDEN
#
# Zero [[write]] blocks declared. Profile exposes write.none() capability bitset.
# External EMS control path will be added ONLY in Phase 6 after shadow mode validation.
#
# EEPROM Protection Rule: Register 0x0BC1 must NEVER appear in any write path. Legacy
# automation V3.3 disabled due to wear risk from periodic writes to non-volatile storage.
